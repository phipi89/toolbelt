[project]
name = "translate"
version = "0.1.0"
description = "Fast terminal dictionary lookups through dict.cc."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.2",
    "requests>=2.32.5",
    "tabulate>=0.9.0",
]

[project.scripts]
translate = "translate.main:main"

[tool.uv]
package = true
