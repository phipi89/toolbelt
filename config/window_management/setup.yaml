# Window Management Rules
apps:
  Firefox:
    action: spawn_new

  Google Chrome:
    action: spawn_new
    spawn_script: osascript -e 'tell application "Google Chrome" to make new window'

  iTerm2:
    action: spawn_new
    spawn_script: tell application "iTerm2" to create window with default profile

  Finder:
    action: spawn_new
    spawn_script: tell application "Finder" to make new Finder window

  Sublime Text:
    action: spawn_new

  Zed:
    action: spawn_new
    spawn_script: /opt/homebrew/bin/zed -n

  Obsidian:
    action: select

  "3D Slicer":
    action: select

  VSCodium:
    action: select

  Overleaf:
    action: select

default_action: goto
